<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本月加班</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="collapsed">
    <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
      <symbol id="i-forward" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 9a7.5 7.5 0 1 0 .2 5M19 4v5h-5"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v11h5v-6h4v6h5V9"/></symbol>
      <symbol id="i-collapse" viewBox="0 0 24 24"><path d="m8 6 6 6-6 6M19 5v14"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M8 14h3M8 17h6"/></symbol>
    </svg>
    <button id="edge" type="button" title="打开本月加班" aria-label="打开本月加班">
      <svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>
      <span>本月加班</span>
    </button>
    <header class="toolbar">
      <div class="panel-title">
        <svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>
        <h1>本月加班</h1>
      </div>
      <button id="collapse" class="icon-button" type="button" title="收起加班面板" aria-label="收起加班面板"><svg class="icon" aria-hidden="true"><use href="#i-collapse"/></svg></button>
    </header>
    <main id="app"></main>
    <footer class="panel-footer">
      <span id="oaStatus" role="status">正在连接 OA</span>
      <nav aria-label="OA 页面导航">
        <button id="back" class="icon-button" type="button" title="返回上一页" aria-label="返回上一页"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
        <button id="forward" class="icon-button" type="button" title="前进到下一页" aria-label="前进到下一页"><svg class="icon" aria-hidden="true"><use href="#i-forward"/></svg></button>
        <button id="reload" class="icon-button" type="button" title="刷新 OA 页面" aria-label="刷新 OA 页面"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
        <button id="home" class="icon-button" type="button" title="打开 OA 首页" aria-label="打开 OA 首页"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg></button>
      </nav>
    </footer>
    <script src="./renderer.js"></script>
  </body>
</html>
